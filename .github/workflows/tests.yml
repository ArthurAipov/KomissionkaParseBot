name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: watcher_test
          POSTGRES_USER: watcher
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U watcher -d watcher_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      API_KEY: ci-only-secret-at-least-32-characters
      DATABASE_URL: postgresql+psycopg://watcher:test-password@localhost:5432/watcher_test
      TEST_DATABASE_URL: postgresql+psycopg://watcher:test-password@localhost:5432/watcher_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests migrations scripts
      - run: ruff format --check app tests migrations scripts
      - run: alembic upgrade head
      - run: alembic check
      - run: python -m pytest -q
